<style>
body {
    cursor: url('./images/mouse.png'), auto;	
    background-color: #43F560;
}

.Title{
    color: black;
    font-family: 'Josefin Sans';
    font-style: normal;
    font-family: cyber;
    margin-top: 8%;
    overflow: hidden;
    white-space: nowrap;
}

.name {
    font-weight: 700;
    font-size: 80px;
    display:inline-block
}



.men {
    display: flex;
    justify-content: space-evenly;
    
}

.menbar{
    z-index: 1;
    margin-top: 50px;
}


.decal{
    position: absolute;
    right: 10px;
    bottom:10px;
    width:auto;
    height: 30%;
}

.smalldecal{
    position:absolute;
    bottom:10px;
    left: 0px;
}



a {
    font-family: 'Goldman', cursive;
    color:black;
    text-decoration: none;
    font-size: 22px;
}

a:hover{
    color:greenyellow;
}

.paralax{
    z-index: 1;
    color: black;
    height: 200vh; /* Just to create scrollable content */
}

.blur-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.3); /* White with 50% opacity */
    backdrop-filter: blur(10px); /* Apply blur to the background content */
    pointer-events: none; /* Make sure the overlay doesn't block interaction */
    z-index: 2;
    opacity: 0; /* Start with the overlay hidden */
    transition: opacity 1s ease-in-out;
}

.black-block {
    position: fixed;
    top: 100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    transform: translateY(110%);
    z-index: 3;
    transition: transform 0.5s ease-in-out;
}

@font-face {
    font-family: cyber;
    src: url(images/fonts/PLANK___.TTF);
}




</style>
